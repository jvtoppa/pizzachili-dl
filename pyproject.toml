[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pizzachili"
version = "0.1.0"
description = "Tool to download pizza-chili."
dependencies = [
    "typer>=0.9.0",
]
requires-python = ">=3.8"

[project.scripts]
pizzachili-dl = "pizzachili.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pizzachili"]